      label: VTube Studio
      rect: [4, 8, 24, 20]
      shape: rounded
      color: pink
      info:
        - title: VTube Studio
          body: |
            Takes the ARKit blendshapes coming off the iPhone, drives the model
            with them, and renders the result.
          specs:
