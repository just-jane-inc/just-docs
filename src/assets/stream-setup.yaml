# ---------------------------------------------------------------------------
# Stream setup
# ---------------------------------------------------------------------------
#
# The scene can contain a list of nodes
#
#   id       Unique, used for deep links (#node-<id>)
#   label    Text drawn on the box
#   hint     Optional sublabel
#   rect     [x, y, width, height] as percentages of parent box
#   shape    box (default) | rounded | pill | circle | screen
#   color    A CSS colour or hex code (e.g., blue, "#deadff")
#   icon     Optional icon or emoji in the box above label
#   into     Optional id of another scene to double-click into
#   nodes    Optional children nodes
#   info     Optional list of description panel pages
#
# A scene can also ahve `edges` to link nodes together
#
#   edges:
#     - from: some-node-id    # any node id, including nested options
#       to: another-node-id
#       label: NDI video      # optional
#       dashed: true          # optional
#
# A description panel page (info) can have:
#
#   title    Tab label/header
#   body     text
#   specs    List of { label, value } rows to render as a table
#   link     Optional { label, href } for a linkout click

- id: overview
  title: Jane's Streaming Setup
  caption: Click a box to read about it below. Double click a box with an arrow to drill deeper.
  aspect: "16 / 9"
  info:
    - title: Multiple PCs
      body: |
        The stream runs using two systems to make the magic happen.

        The primary system is a custom built desktop running **Linux Mint**.
        This PC is used for games, code, OBS, and whimsy.
        
        A **M4 Mac Mini** is used to run VTube Studio and pipe the output via NDI to the primary system.
        Additionally, the Mac is responsible for some Speech to Text processing.

    - title: Tracking
      body: | 
        An iPhone handles the face tracking for VTube Studio running on the Mac Mini.

        It is an iPhone 13 Pro Max, but mostly any iPhone after 10 should work for face tracking.

    - title: Why split it up?
      body: |
        iPhone's are the closest there is to a "gold standard" for VTubing face tracking, 
        as input data for VTube Studio.
        
        The Mac Mini is used for VTube Studio as VTS does not run "well" on Linux, 
        requiring quite a few hacks we'd like to avoid. Addtionally, it off-loads the processing 
        on a separate system which is able to handle the proper video capture needed from VTS and 
        send it over the network via NDI Broadcasting.
        
        As far as the primary PC is concerned, it's just another video input source in OBS.

        As for speech to text, Apple's [SpeechAnalyzer](https://developer.apple.com/documentation/speech/speechanalyzer) 
        is a convenient and powerful tool, allowing Jill to listen and react to Jane and the stream content.
        `"Jill, Roll Credits"`

  edges:
    - from: iphone
      to: mac-mini
      label: ARKit
    - from: mac-mini
      to: desktop
      label: NDI video, STT
    - from: desktop
      to: twitch
      label: stream
      dashed: true
  nodes:
    - id: desktop
      label: Primary Desktop
      hint: Linux Mint
      rect: [3, 2, 34, 32]
      shape: rounded
      color: "#deadff"
      into: desktop
      info:
        - title: Desktop
          body: |
            The main machine where whimsy is developed
          specs:
            - label: OS
              value: Linux Mint
            - label: Roles
              value: Games, development, streaming
          link:
            label: View More
            href: "#node-monitor"

    - id: twitch
      label: Twitch
      rect: [62, 5, 32, 24]
      shape: pill
      color: purple
      info:
        - title: Twitch Broadcast
          body: |
            OBS on the primary desktop encodes all sources and sends them to Twitch
          link:
            label: View the Stream
            href: "https://twitch.tv/just__jane"

    - id: mac-mini
      label: Mac Mini
      hint: M4
      rect: [3, 56, 20, 30]
      shape: rounded
      color: cyan
      into: mac
      info:
        - title: Mac Mini (M4)
          body: |
            A small, efficient, and always-on M4 Mac Mini. Handling both VTube Studio
            and speech to text tasks.
          specs:
            - label: Machine
              value: Mac Mini (M4)
            - label: Runs
              value: VTube Studio, SpeechAnalyzer
            - label: Receives
              value: ARKit tracking from iPhone
            - label: Sends
              value: NDI video to OBS, Jill's Data
        - title: Why macOS
          body: |
            It's not Windows.

    - id: iphone
      label: iPhone
      hint: 13 Pro Max
      icon: "\U0001F4F1" # phone emoji
      rect: [42, 56, 9, 30]
      shape: rounded
      color: grey
      info:
        - title: ARKit face tracking
          body: |
            The phone utilizes Apple's **ARKit** face tracking and sends it to VTube Studio directly
          specs:
            - label: Tracking
              value: ARKit
            - label: Sends to
              value: VTube Studio on the Mac

